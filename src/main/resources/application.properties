# Configuration commune (indépendante de l'environnement).
# Le profil actif est piloté par SPRING_PROFILES_ACTIVE (défaut : dev en local).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:esport_db}
spring.datasource.username=${DB_USER:esport_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Actuator : n'expose que la sonde de santé (health), sans détails par défaut.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2:1b}
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Vector Store ChromaDB
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=${CHROMA_COLLECTION:esport-rules}
spring.ai.vectorstore.chroma.initialize-schema=true

# Microservice d'orchestration Multi-Agents LangGraph (Python)
ai.agent.service.url=${AI_AGENT_SERVICE_URL:http://localhost:8001}

# Instrumentation Langfuse / OpenTelemetry pour Spring AI
spring.ai.chat.client.observations.include-prompt=true
spring.ai.chat.client.observations.include-completion=true

management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${LANGFUSE_HOST:https://cloud.langfuse.com}/api/public/otel/v1/traces
management.otlp.tracing.headers.Authorization=${LANGFUSE_AUTH_HEADER:}

